[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-scheduling-fairness"
version = "0.1.0"
description = "Portable foundation for a Linux CPU scheduling fairness study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["numpy", "pandas", "matplotlib"]

[project.scripts]
cpu-fairness = "cpu_fairness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cpu_fairness.telemetry" = ["*.bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
